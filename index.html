<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameZone</title>
<meta name="description" content="Find friends to play with. Match by game, rank, role and vibe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one quiet cream sheet, ink outlines, hard offset shadows; colour only on things you can press. */
  --paper:#F3EADB; --card:#FBF6EC; --ink:#3B2F2F; --ink-soft:#7A6A62; --line:#D9CCB8;
  --coral:#EF7A5E; --blue:#345E8F; --mustard:#E2B04A; --sage:#8DAA8B;
  --font-display:"Bowlby One","Arial Black",Impact,sans-serif;
  --font-body:"IBM Plex Sans","IBM Plex Sans Thai","Noto Sans SC","Noto Sans JP","Hiragino Sans","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --shadow:4px 4px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:.03em;line-height:1.15;margin:0;text-wrap:balance}
html:not([lang="en"]) h1,html:not([lang="en"]) h2,html:not([lang="en"]) h3,html:not([lang="en"]) .btn.big,html:not([lang="en"]) .btn.mid{font-family:var(--font-body);font-weight:700;letter-spacing:0}
p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--font-mono),var(--font-body);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft);font-size:14px}

.nav{margin:16px auto 0;background:var(--ink);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-family:var(--font-display);font-size:19px;color:var(--paper);background:none;border:0;padding:6px 10px;letter-spacing:.04em;text-shadow:2px 2px 0 var(--coral)}
.nav-links{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.nav-links button{background:none;border:0;color:#D8CABB;padding:8px 12px;border-radius:9px;font-family:var(--font-mono),var(--font-body);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.nav-links button:hover{color:var(--paper)}
.nav-links button[aria-current="page"]{background:#55453F;color:var(--paper)}
.nav-right{display:flex;align-items:center;gap:8px;position:relative}
.me-btn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px;border-radius:999px;color:var(--paper);font-size:14px}
.menu{position:absolute;right:0;top:calc(100% + 12px);background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);min-width:180px;padding:6px;z-index:20;display:flex;flex-direction:column}
.menu button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px}
.menu button:hover{background:var(--paper)}

.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;border:2px solid var(--ink);overflow:hidden;display:inline-grid;place-items:center;background:var(--blue);flex:none}
.nav .av{border-color:var(--paper)}
.av img,.av svg{width:100%;height:100%;display:block;object-fit:cover}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:10px 18px;font-weight:600;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.coral{background:var(--coral)} .btn.blue{background:var(--blue);color:var(--paper)}
.btn.ghost{box-shadow:none;background:transparent} .btn.ghost:hover{background:var(--card);transform:none}
.btn.small{padding:6px 12px;font-size:14px;border-radius:10px;box-shadow:2px 2px 0 var(--ink)}
.btn.big{font-family:var(--font-display);font-weight:400;font-size:clamp(20px,3.4vw,28px);letter-spacing:.06em;padding:18px 40px;border-radius:20px;box-shadow:5px 5px 0 var(--ink);color:var(--paper);text-shadow:2px 2px 0 var(--ink)}
.btn.mid{font-family:var(--font-display);font-weight:400;font-size:clamp(14px,2.2vw,17px);letter-spacing:.06em;padding:12px 26px;color:var(--paper);text-shadow:1.5px 1.5px 0 var(--ink)}
.btn[disabled]{opacity:.5;pointer-events:none}

.hero{padding:72px 0 56px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.hero h1{font-size:clamp(34px,6.4vw,64px)}
.hero h1 em{font-style:normal;color:var(--coral);text-shadow:3px 3px 0 var(--ink)}
.hero p{max-width:46ch;color:var(--ink-soft);font-size:17px}
.hero-cta{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
section.block{padding:28px 0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:24px}
.grid{display:grid;gap:16px}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:18px}
.card.pop{box-shadow:var(--shadow)}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:0;overflow:hidden;box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.band{height:92px;display:flex;align-items:flex-end;padding:12px 16px;border-bottom:2px solid var(--ink);position:relative;overflow:hidden}
.band h3{font-size:26px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);position:relative;font-family:var(--font-display)!important;font-weight:400!important;letter-spacing:.03em!important}
.band::after{content:"";position:absolute;right:-18px;top:-18px;width:96px;height:96px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);opacity:.9}
.tile .body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:6px}
.c-coral{background:var(--coral)}.c-blue{background:var(--blue)}.c-mustard{background:var(--mustard)}.c-sage{background:var(--sage)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.chip:hover{background:#fff}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tag{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:1px 9px;font-size:12.5px;background:var(--paper);white-space:nowrap}
.tag.full{background:var(--line);color:var(--ink-soft);border-color:var(--ink-soft)} .tag.open{background:var(--sage)} .tag.you{background:var(--mustard)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mode{text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.mode:hover{background:#fff}
.mode b{font-weight:600} .mode span{font-size:13.5px;color:var(--ink-soft)}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--paper)} .mode[aria-pressed="true"] span{color:#D8CABB}
.group-label{margin:18px 0 8px}
.queue{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:22px}
.room{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.room-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.room h3{font-family:var(--font-body);font-weight:600;font-size:17px;letter-spacing:0;line-height:1.3}
.slots{display:flex;gap:5px}
.slot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:transparent} .slot.on{background:var(--ink)} .slot.me{background:var(--mustard)}
.room-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:500}
.inp{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:9px 12px;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:70px}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.err{color:#B3261E;font-size:14px;min-height:20px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.hint{font-size:13px;color:var(--ink-soft);font-weight:400}

.scrim{position:fixed;inset:0;background:rgba(59,47,47,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.dialog{background:var(--paper);border:2px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);width:min(460px,100%);padding:24px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.dialog.wide{width:min(580px,100%)}
.dialog h2{font-size:22px}
.dialog form{display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.tabs button{border:0;background:var(--card);padding:10px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.dialog-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.member{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1.5px dashed var(--line)}
.member:last-child{border-bottom:0}
.avatar-pick{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.avatar-pick button{background:none;border:0;padding:0;border-radius:50%}
.avatar-pick button[aria-pressed="true"] .av{box-shadow:0 0 0 3px var(--coral)}
.steps{display:flex;gap:8px;align-items:center}
.steps i{width:34px;height:8px;border-radius:99px;border:2px solid var(--ink);background:transparent} .steps i.on{background:var(--ink)}
.setup{max-width:640px;margin:36px auto;display:flex;flex-direction:column;gap:18px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--mustard);border:2px solid var(--ink);border-radius:var(--r);padding:12px 16px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
footer{padding:36px 0 72px;color:var(--ink-soft);font-size:13.5px;border-top:2px dashed var(--line);margin-top:28px}
.back{background:none;border:0;padding:0;color:var(--ink-soft);font-family:var(--font-mono),var(--font-body);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.back:hover{color:var(--ink)}
.game-hero{padding:32px 0 8px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.game-hero h1{font-size:clamp(34px,6vw,54px)}

/* language switch */
.lang{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;background:var(--card);border:2px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);padding:3px;gap:2px}
.lang button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* profile */
.ph{display:flex;gap:32px;align-items:center;padding:36px 0 20px;flex-wrap:wrap}
.ring{background:none;border:0;padding:5px;border-radius:50%;flex:none}
.ring.has{background:conic-gradient(var(--coral),var(--mustard),var(--sage),var(--blue),var(--coral))}
.ring .av{border-width:3px;border-color:var(--paper);outline:2px solid var(--ink)}
.ph-info{flex:1;min-width:260px;display:flex;flex-direction:column;gap:10px}
.ph-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ph-top h1{font-family:var(--font-body);font-weight:700;font-size:26px;letter-spacing:0;overflow-wrap:anywhere;margin-right:6px}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stats b{font-size:18px}
.hls{display:flex;gap:18px;overflow-x:auto;padding:8px 2px 18px;border-bottom:2px dashed var(--line)}
.hl{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;flex:none;font-size:12.5px}
.hl span.c{width:66px;height:66px;border-radius:50%;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;overflow:hidden;font-size:26px;box-shadow:2px 2px 0 var(--ink)}
.hl span.c img{width:100%;height:100%;object-fit:cover}
.hl span.n{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrbar{display:none;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--mustard);border:2px solid var(--ink);border-radius:var(--r);padding:10px 14px;margin-top:16px}
.arranging .arrbar{display:flex}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 0;grid-auto-flow:dense}
.widget{grid-column:span 2;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
.widget.w1{grid-column:span 1}.widget.w4{grid-column:span 4}
.own .widget{-webkit-touch-callout:none}
.w-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.w-tools{display:flex;gap:6px}
.icon{border:2px solid var(--ink);background:var(--paper);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-size:13px;font-weight:700;padding:0;line-height:1}
.icon:hover{background:#fff}
.arr-only{display:none}
.arranging .arr-only{display:grid}
.arranging .edit-only{display:none}
.arranging .widget{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;animation:wig .28s ease-in-out infinite alternate}
.arranging .widget:nth-child(even){animation-delay:.14s}
@keyframes wig{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
.widget.dragging{opacity:.3;animation:none}
.drag-ghost{position:fixed;z-index:70;pointer-events:none;box-shadow:8px 8px 0 var(--ink);animation:none!important;transform:rotate(1.5deg);margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14.5px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.main-band{margin:0;height:68px;border:2px solid var(--ink);border-radius:10px}
.g-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:0;background:none;padding:8px 0;border-bottom:1.5px dashed var(--line);text-align:left;width:100%}
.g-row:last-child{border-bottom:0}
.hidden-list{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* story viewer */
.viewer{position:fixed;inset:0;background:#1d1717;z-index:60;display:flex;flex-direction:column;align-items:center;color:#F3EADB}
.v-top{width:min(460px,100%);padding:12px 14px 6px;display:flex;flex-direction:column;gap:10px}
.v-bars{display:flex;gap:4px} .v-bars i{flex:1;height:4px;border-radius:9px;background:#6b5a55} .v-bars i.on{background:#F3EADB}
.v-who{display:flex;align-items:center;gap:10px;font-size:14px}
.v-who .x{margin-left:auto;background:none;border:0;color:#F3EADB;font-size:24px;line-height:1;padding:4px 8px}
.v-stage{flex:1;width:min(460px,100%);position:relative;min-height:0;display:grid;place-items:center}
.v-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.v-stage button.z{position:absolute;top:0;bottom:0;width:38%;background:none;border:0}
.v-stage button.z.l{left:0}.v-stage button.z.r{right:0}
.v-cap{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(29,23,23,.7);padding:8px 12px;border-radius:10px;text-align:center}
.v-foot{width:min(460px,100%);padding:10px 14px 18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.v-foot .btn{box-shadow:none;border-color:#F3EADB;background:transparent;color:#F3EADB;font-size:14px;padding:7px 12px}
.v-foot .inp{width:auto;flex:1;min-width:140px;color:var(--ink)}
.preview{max-height:46vh;max-width:100%;border:2px solid var(--ink);border-radius:12px;align-self:center}

@media (max-width:760px){
  .wgrid{grid-template-columns:repeat(2,1fr)}
  .widget,.widget.w4{grid-column:span 2}
  .hero{padding:48px 0 36px}
  .ph{gap:18px;padding-top:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</div>

<div id="dialog-root"></div>
<input type="file" id="story-file" accept="image/*" hidden>

function resizeImage(file,max,square){ return new Promise((res,rej)=>{ const fr = new FileReader(); fr.onerror = rej;
  fr.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
    const c = document.createElement("canvas"); let sx=0,sy=0,sw=img.width,sh=img.height;
    if(square){ const s=Math.min(sw,sh); sx=(sw-s)/2; sy=(sh-s)/2; sw=sh=s; c.width=c.height=Math.min(max,s); }
    else { const k=Math.min(1,max/Math.max(sw,sh)); c.width=Math.round(sw*k); c.height=Math.round(sh*k); }
    c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height); c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",.85); };
    img.src = fr.result; }; fr.readAsDataURL(file); }); }

async function loadMe(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ S.me=null; return; }
  const [{data:p},{data:c}] = await Promise.all([sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle(), sb.from("profile_contacts").select("*").eq("id",session.user.id).maybeSingle()]);
  S.me = p ? {...p, contacts: c || {discord:"",line:"",show:"friends"}} : null;
  if(S.me) loadStories(S.me.id,true);
}
async function saveProfile(patch,quiet){
  Object.assign(S.me,patch);
  const { error } = await sb.from("profiles").update({...patch,updated_at:new Date().toISOString()}).eq("id",S.me.id);
  if(error) toast(t("tFail")); else if(!quiet) toast(t("saved"));
  return !error;
}
async function loadStories(userId,own){
  const { data } = await sb.from("stories").select("*").eq("user_id",userId).order("created_at",{ascending:true});
  let rows = data || [];
  if(own){ const dead = rows.filter(s=>!s.highlight && Date.now()-new Date(s.created_at)>864e5);
    if(dead.length){ rows = rows.filter(s=>!dead.includes(s)); sb.storage.from("media").remove(dead.map(s=>s.path)); sb.from("stories").delete().in("id",dead.map(s=>s.id)).then(()=>{}); } }
  S.stories[userId] = rows;
  if(["profile","user"].includes(route()) && !S.dialog && !drag) render();
}
const activeStories = id => (S.stories[id]||[]).filter(s=>Date.now()-new Date(s.created_at)<864e5);
function highlights(id){ const m = new Map(); (S.stories[id]||[]).forEach(s=>{ if(s.highlight){ if(!m.has(s.highlight)) m.set(s.highlight,[]); m.get(s.highlight).push(s); } }); return [...m.entries()]; }
async function loadViewing(name){
  S.viewKey = name; S.viewing = undefined;
  const { data:p } = await sb.from("profiles").select("*").ilike("username",name.replace(/_/g,"\\_")).maybeSingle();
  if(S.viewKey!==name) return;
  if(p){ const { data:c } = await sb.from("profile_contacts").select("*").eq("id",p.id).maybeSingle(); S.viewing = {...p,contacts:c||null}; loadStories(p.id,false); }
  else S.viewing = null;
  render();
}

const kv = rows => { const r = rows.filter(x=>x[1]); return r.length ? `<dl class="kv">${r.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : `<p class="muted">${t("empty")}</p>`; };
function widgetBody(id,p,own){
  const gear = p.gear||{}, pc = gear.pc||{}, kit = gear.kit||{}, set = gear.settings||{};
  if(id==="main"){ const k = p.main_game && GAMES[p.main_game] ? p.main_game : ""; if(!k) return `<p class="muted">${t("empty")}</p>`; const d = (p.games||{})[k]||{};
    return `<div class="band main-band ${GAMES[k].color}"><h3>${GAMES[k].name}</h3></div>${kv([[t("ign"),d.ign],[t("rank"),d.rank],[t("roles"),(d.roles||[]).join(", ")],[t("serious"),d.serious&&tl(d.serious)],[t("favs"),d.favs]])}`; }
  if(id==="games"){ const list = p.playing.filter(k=>k!==p.main_game && GAMES[k]); if(!list.length) return `<p class="muted">${t("empty")}</p>`;
    return `<div>${list.map(k=>{ const d=(p.games||{})[k]||{}; const inner = `<span><b>${GAMES[k].name}</b>${d.ign?` <span class="muted">${esc(d.ign)}</span>`:""}</span><span class="chips">${d.rank?`<span class="tag">${esc(d.rank)}</span>`:""}${(d.roles||[]).slice(0,2).map(r=>`<span class="tag">${esc(r)}</span>`).join("")}</span>`;
      return own?`<button class="g-row" data-act="edit" data-what="game" data-game="${k}">${inner}</button>`:`<div class="g-row">${inner}</div>`; }).join("")}</div>`; }
  if(id==="about"){ const tags = [p.age&&t("age")+" "+p.age,p.gender&&tl(p.gender),p.mbti&&p.mbti!=="Not sure"&&p.mbti,...p.vibes.map(tl)].filter(Boolean);
    return tags.length?`<div class="chips">${tags.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:`<p class="muted">${t("empty")}</p>`; }
  if(id==="times") return p.times.length?`<div class="chips">${p.times.map(x=>`<span class="tag">${esc(tl(x))}</span>`).join("")}</div>`:`<p class="muted">${t("empty")}</p>`;
  if(id==="pc") return kv([[t("cpu"),pc.cpu],[t("gpu"),pc.gpu],[t("ram"),pc.ram],[t("monitor"),pc.monitor],[t("storage"),pc.storage]]);
  if(id==="gear") return kv([[t("device"),kit.device&&tl(kit.device)],[t("mouse"),kit.mouse],[t("keyboard"),kit.keyboard],[t("headset"),kit.headset],[t("mousepad"),kit.mousepad],[t("mic"),kit.mic]]);
  if(id==="settings") return kv([[t("dpi"),set.dpi],[t("sens"),set.sens],[t("res"),set.res],[t("cross"),set.cross],[t("notes"),set.notes]]);
  if(id==="contact"){ const c = p.contacts; if(!c || (!own && c.show!=="everyone")) return `<p class="muted">${t("cHidden")}</p>`; return kv([[t("discord"),c.discord],[t("line"),c.line]]); }
  return "";
}

  if(d.what==="gear") return [t("bGear"),`<div class="row"><label class="f">${t("device")}${sel("e-device",DEVICES,kit.device,t("notSet"))}</label>${inp("e-mouse",t("mouse"),kit.mouse)}${inp("e-keyboard",t("keyboard"),kit.keyboard)}${inp("e-headset",t("headset"),kit.headset)}${inp("e-mousepad",t("mousepad"),kit.mousepad)}${inp("e-mic",t("mic"),kit.mic)}</div>`];
  if(d.what==="settings") return [t("bSettings"),`<div class="row">${inp("e-dpi",t("dpi"),set.dpi,10)}${inp("e-sens",t("sens"),set.sens,20)}${inp("e-res",t("res"),set.res,30)}</div>${inp("e-cross",t("cross"),set.cross,120)}<label class="f">${t("notes")}<textarea class="inp" id="e-notes" maxlength="200">${esc(set.notes)}</textarea></label>`];

let viewTimer;

    inner = wrap(esc(title),`<form data-form="edit">${body}<p class="err" id="e-err" role="alert"></p><div class="dialog-actions"><button class="btn ghost" type="button" data-act="close">${t("cancel")}</button><button class="btn coral" type="submit">${t("save")}</button></div></form>`,"wide");
  } else if(d.type==="story-new"){
    inner = wrap(t("addStory"),`<img class="preview" src="${d.url}" alt=""><form data-form="story"><label class="f">${t("caption")}<input class="inp" id="st-cap" maxlength="120"></label>
      <p class="err" id="st-err" role="alert"></p><div class="dialog-actions"><button class="btn ghost" type="button" data-act="close">${t("cancel")}</button><button class="btn coral" type="submit" id="st-go">${t("post")}</button></div></form>`);
  } else if(d.type==="viewer"){
    const all = S.stories[d.uid]||[], list = d.ids.map(id=>all.find(s=>s.id===id)).filter(Boolean);
    if(!list.length){ S.dialog=null; root.innerHTML=""; return; }
    d.i = Math.min(d.i,list.length-1); const s = list[d.i], own = S.me && S.me.id===d.uid, who = own?S.me:S.viewing;
    root.innerHTML = `<div class="viewer" role="dialog" aria-modal="true" aria-label="${t("stStories")}">
      <div class="v-top"><div class="v-bars">${list.map((_,i)=>`<i class="${i<=d.i?"on":""}"></i>`).join("")}</div>
        <div class="v-who">${avatar(who,32)}<b>${esc(who?who.display_name:"")}</b><span>${s.highlight&&d.hl?esc(s.highlight):ago(s.created_at)}</span><button class="x" data-act="close" aria-label="${t("close")}">×</button></div></div>
      <div class="v-stage"><img src="${esc(mediaURL(s.path))}" alt="">${s.caption?`<div class="v-cap">${esc(s.caption)}</div>`:""}
        <button class="z l" data-act="v-prev" aria-label="Previous"></button><button class="z r" data-act="v-next" aria-label="Next"></button></div>
      <div class="v-foot">${own ? (d.form
        ? `<form data-form="hl" style="display:flex;gap:8px;flex:1;flex-wrap:wrap"><input class="inp" id="hl-name" maxlength="20" placeholder="${t("hlName")}" list="hl-list" value="${esc(s.highlight||"")}"><datalist id="hl-list">${highlights(d.uid).map(([n])=>`<option value="${esc(n)}">`).join("")}</datalist><button class="btn" type="submit">${t("save")}</button><button class="btn" type="button" data-act="v-form-off">${t("cancel")}</button></form>`
        : `<button class="btn" data-act="v-form">${t("addHl")}</button>${s.highlight?`<button class="btn" data-act="v-unhl">${t("rmHl")}</button>`:""}<button class="btn" data-act="v-del">${t("del")}</button>`) : ""}</div></div>`;
    if(!d.form) viewTimer = setTimeout(()=>stepViewer(1),5000); else { const f=$("#hl-name"); if(f) f.focus(); }
    return;
  }
  root.innerHTML = `<div class="scrim" data-act="scrim">${inner}</div>`;
  const first = root.querySelector("input:not([type=checkbox]),button.coral,button"); if(first) first.focus();
}
function stepViewer(n){ const d = S.dialog; if(!d || d.type!=="viewer") return; const i = d.i+n; if(i<0) d.i=0; else if(i>=d.ids.length){ S.dialog=null; } else d.i=i; renderDialog(); }
const curStory = () => { const d = S.dialog; return (S.stories[d.uid]||[]).find(s=>s.id===d.ids[d.i]); };

/* ---------- render ---------- */
function render(){
  document.documentElement.lang = S.lang;
  $("#nav").innerHTML = navHTML();
  const r = route();
  if(r!=="profile" && r!=="user") S.arranging=false;
  $("#view").innerHTML = views[r]();
  $("#foot").textContent = t("foot");
  $("#lang-root").innerHTML = r==="home" ? `<div class="lang" role="group" aria-label="Language">${LANGS.map(([k,l])=>`<button data-act="lang" data-val="${k}" aria-pressed="${S.lang===k}">${l}</button>`).join("")}</div>` : "";
}
const rerender = () => { const y = window.scrollY; render(); window.scrollTo(0,y); };

/* ---------- auth ---------- */
const synthEmail = name => name.toLowerCase()+"@users.gamezone.app";
async function signup(){
  const name = $("#au-user").value.trim(), pw = $("#au-pass").value, pw2 = $("#au-pass2").value, err = $("#au-err"), btn = $("#au-go");
  if(!/^[A-Za-z0-9_]{3,16}$/.test(name)) return err.textContent = t("eUser");
  if(pw.length<8) return err.textContent = t("ePass");
  if(pw!==pw2) return err.textContent = t("eMatch");
  lsSet("gz.remember",$("#au-remember").checked?"1":"0");
  btn.disabled = true; err.textContent = t("working");
  try{
    const res = await fetch(SB_URL+"/functions/v1/signup",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({username:name,password:pw})});
    const out = await res.json().catch(()=>({}));
    if(!res.ok){ btn.disabled=false; return err.textContent = out.error==="taken"?t("eTaken"):out.error==="bad_username"?t("eUser"):out.error==="bad_password"?t("ePass"):t("eNet"); }
    const { error } = await sb.auth.signInWithPassword({email:synthEmail(name),password:pw});
    if(error) throw error;
    await loadMe(); S.dialog=null; S.setupStep=1; renderDialog(); go("setup");
  }catch(e){ btn.disabled=false; err.textContent = t("eNet"); }
}
async function login(){
  const name = $("#au-user").value.trim(), pw = $("#au-pass").value, err = $("#au-err"), btn = $("#au-go");
  if(!/^[A-Za-z0-9_]{3,16}$/.test(name) || !pw) return err.textContent = t("eWrong");
  lsSet("gz.remember",$("#au-remember").checked?"1":"0");
  btn.disabled = true; err.textContent = t("working");
  try{
    const { error } = await sb.auth.signInWithPassword({email:synthEmail(name),password:pw});
    if(error){ btn.disabled=false; return err.textContent = error.status===400 ? t("eWrong") : t("eNet"); }
    await loadMe(); S.dialog=null; renderDialog();
    if(S.me && !isReady(S.me)){ S.setupStep=1; go("setup"); } else { render(); if(S.me) toast(t("tWelcome",{n:S.me.display_name})); }
  }catch(e){ btn.disabled=false; err.textContent = t("eNet"); }
}
async function logout(){ S.menu=false; try{ await sb.auth.signOut(); }catch(e){} S.me=null; go("home"); toast(t("tOut")); }

/* ---------- saving edit forms ---------- */
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
const pressed = group => [...document.querySelectorAll(`#dialog-root .chip[data-group="${group}"][aria-pressed="true"]`)].map(b=>b.dataset.val);
async function saveEdit(){
  const d = S.dialog, p = S.me, err = $("#e-err"); let patch = {};
  if(d.what==="basic"){ const name = val("e-name"), age = val("e-age"); if(!name) return err.textContent = t("eName"); if(age && !(+age>=13 && +age<=99)) return err.textContent = t("eAge");
    patch = {display_name:name,age:age?+age:null,mbti:val("e-mbti"),gender:val("e-gender"),bio:val("e-bio")}; }
  else if(d.what==="games"){ const playing = pressed("playing"); let main = val("e-main"); if(!playing.includes(main)) main = playing[0]||""; patch = {playing,main_game:main}; }
  else if(d.what==="game"){ const games = {...(p.games||{})}; games[d.game] = {ign:val("e-ign"),rank:val("e-rank"),serious:val("e-serious"),roles:pressed("roles"),favs:val("e-favs")}; patch = {games}; }
  else if(d.what==="about") patch = {vibes:pressed("vibes")};
  else if(d.what==="times") patch = {times:pressed("times")};
  else if(d.what==="pc") patch = {gear:{...(p.gear||{}),pc:{cpu:val("e-cpu"),gpu:val("e-gpu"),ram:val("e-ram"),monitor:val("e-monitor"),storage:val("e-storage")}}};
  else if(d.what==="gear") patch = {gear:{...(p.gear||{}),kit:{device:val("e-device"),mouse:val("e-mouse"),keyboard:val("e-keyboard"),headset:val("e-headset"),mousepad:val("e-mousepad"),mic:val("e-mic")}}};
  else if(d.what==="settings") patch = {gear:{...(p.gear||{}),settings:{dpi:val("e-dpi"),sens:val("e-sens"),res:val("e-res"),cross:val("e-cross"),notes:val("e-notes")}}};
  else if(d.what==="contact"){ const c = {id:p.id,discord:val("e-discord"),line:val("e-line"),show:val("e-show")||"friends"};
    const { error } = await sb.from("profile_contacts").upsert(c); if(error) return err.textContent = t("tFail");
    p.contacts = c; S.dialog=null; renderDialog(); rerender(); return toast(t("saved")); }
  S.dialog=null; renderDialog(); await saveProfile(patch); rerender();
}
async function setAvatar(value){ const old = S.me.avatar; await saveProfile({avatar:value},true);
  if(old && !old.startsWith("preset:") && old!==value) sb.storage.from("media").remove([old]);
  if(S.dialog && S.dialog.type==="edit") renderDialog(); rerender(); toast(t("tPic")); }

/* ---------- drag to arrange (press and hold, like phone widgets) ---------- */
let drag = null, press = null, pressTimer = null;
function setArranging(on){ S.arranging = on; const r = $("#pf-root"); if(r) r.classList.toggle("arranging",on); }
function startDrag(w,x,y){
  const rect = w.getBoundingClientRect(), ghost = w.cloneNode(true);
  ghost.classList.add("drag-ghost"); ghost.style.width = rect.width+"px"; ghost.style.height = rect.height+"px"; ghost.style.left = rect.left+"px"; ghost.style.top = rect.top+"px";
  document.body.appendChild(ghost); w.classList.add("dragging"); drag = {w,ghost,dx:x-rect.left,dy:y-rect.top};
}
function saveLayoutFromDOM(){
  const grid = $("#wgrid"); if(!grid || !S.me) return; const lay = layoutOf(S.me), order = [...grid.children].map(c=>c.dataset.wid);
  const next = order.map(id=>lay.find(x=>x.id===id)).filter(Boolean).concat(lay.filter(x=>!order.includes(x.id)));
  saveProfile({layout:next},true);
}
document.addEventListener("pointerdown", e => {
  const w = e.target.closest(".own .widget"); if(!w || S.dialog) return;
  if(e.target.closest("button,a,input,select,textarea")) return;
  if(e.pointerType==="mouse" && e.button!==0) return;
  press = {w,x:e.clientX,y:e.clientY,armed:S.arranging};
  if(!S.arranging) pressTimer = setTimeout(()=>{ if(!press) return; setArranging(true); startDrag(press.w,press.x,press.y); press=null; if(navigator.vibrate) try{ navigator.vibrate(12); }catch(_){} },450);
});
document.addEventListener("pointermove", e => {
  if(drag){
    drag.ghost.style.left = (e.clientX-drag.dx)+"px"; drag.ghost.style.top = (e.clientY-drag.dy)+"px";
    const hit = document.elementFromPoint(e.clientX,e.clientY), target = hit && hit.closest(".widget");
    if(target && target!==drag.w && target.parentElement===drag.w.parentElement){
      const after = drag.w.compareDocumentPosition(target) & Node.DOCUMENT_POSITION_FOLLOWING;
      target.parentElement.insertBefore(drag.w, after ? target.nextSibling : target);
    }
  } else if(press){
    const dist = Math.hypot(e.clientX-press.x,e.clientY-press.y);
    if(press.armed && dist>5){ startDrag(press.w,e.clientX,e.clientY); press=null; }
    else if(!press.armed && dist>8){ clearTimeout(pressTimer); press=null; }
  }
});
function endPress(){ clearTimeout(pressTimer); press=null; if(drag){ drag.ghost.remove(); drag.w.classList.remove("dragging"); drag=null; saveLayoutFromDOM(); } }
document.addEventListener("pointerup", endPress);
document.addEventListener("pointercancel", endPress);
document.addEventListener("touchmove", e => { if(drag) e.preventDefault(); }, {passive:false});
document.addEventListener("contextmenu", e => { if(e.target.closest(".own .widget") && (drag || S.arranging || press)) e.preventDefault(); });

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const goEl = e.target.closest("[data-go]");
  if(goEl){ S.menu=false; go(goEl.dataset.go); return; }
  const el = e.target.closest("[data-act]");
  if(S.menu && !(el && el.dataset.act==="menu")){ S.menu=false; $("#nav").innerHTML = navHTML(); }
  if(!el) return;
  const a = el.dataset.act, d = el.dataset, dlg = S.dialog;
  if(a==="scrim"){ if(e.target===el){ S.dialog=null; renderDialog(); } }
  else if(a==="menu"){ S.menu=!S.menu; $("#nav").innerHTML = navHTML(); }
  else if(a==="lang"){ S.lang=d.val; lsSet("gz.lang",d.val); rerender(); }
  else if(a==="auth"){ S.dialog={type:"auth",tab:d.tab}; renderDialog(); }
  else if(a==="close"){ S.dialog=null; renderDialog(); if(["profile","user"].includes(route())) rerender(); }
  else if(a==="close-go"){ S.dialog=null; renderDialog(); go(d.to); }
  else if(a==="to-setup"){ S.dialog=null; renderDialog(); S.setupStep=1; go("setup"); }
  else if(a==="logout") logout();
  else if(a==="scroll-games"){ const b=$("#games-block"); if(b) b.scrollIntoView({behavior:"smooth",block:"start"}); }
  else if(a==="mode"){ S.pick[d.game].mode=d.mode; rerender(); }
  else if(a==="size"){ S.pick[d.game].size=+d.size; rerender(); }
  else if(a==="filter"){ S.roomFilter=d.val; rerender(); }
  else if(a==="room"){ S.dialog={type:"room",id:d.id}; renderDialog(); }
  else if(a==="match") gate("actMatch",()=>{ S.dialog={type:"info",rooms:d.game}; renderDialog(); });
  else if(a==="join") gate("actJoin",async()=>{ if(!S.me.joined.includes(d.id)) await saveProfile({joined:[...S.me.joined,d.id]},true); rerender(); S.dialog={type:"room",id:d.id}; renderDialog(); toast(t("tJoined")); });
  else if(a==="leave"){ await saveProfile({joined:S.me.joined.filter(x=>x!==d.id)},true); rerender(); renderDialog(); toast(t("tLeft")); }
  else if(a==="chip"){ el.setAttribute("aria-pressed", el.getAttribute("aria-pressed")!=="true"); }
  else if(a==="pf-toggle"){ const cur = [...S.me[d.group]], i = cur.indexOf(d.val); if(i>=0) cur.splice(i,1); else cur.push(d.val);
    const patch = {[d.group]:cur}; if(d.group==="playing"){ patch.main_game = cur.includes(S.me.main_game) ? S.me.main_game : (cur[0]||""); }
    saveProfile(patch,true); rerender(); }
  else if(a==="pf-pick"){ saveProfile({[d.group]:d.val},true); rerender(); }
  else if(a==="preset") setAvatar("preset:"+d.i);
  else if(a==="setup-back"){ S.setupStep--; render(); }
  else if(a==="setup-next"){ const p = S.me, err = $("#su-err");
    if(S.setupStep===1){ if(!p.avatar) return err.textContent=t("ePic"); if(!p.display_name) return err.textContent=t("eName"); if(!(Number(p.age)>=13&&Number(p.age)<=99)) return err.textContent=t("eAge"); }
    if(S.setupStep===2 && !p.playing.length) return err.textContent=t("eGame");
    if(S.setupStep<3){ S.setupStep++; render(); window.scrollTo(0,0); } else { S.setupStep=1; go("profile"); toast(t("tReady")); } }
  else if(a==="edit"){ S.dialog={type:"edit",what:d.what,game:d.game}; renderDialog(); }
  else if(a==="arrange") setArranging(true);
  else if(a==="arrange-done"){ setArranging(false); rerender(); }
  else if(a==="w-size"){ const lay = layoutOf(S.me), x = lay.find(o=>o.id===d.wid), allowed = WIDGETS.find(w=>w[0]===d.wid)[2];
    x.w = allowed[(allowed.indexOf(x.w)+1)%allowed.length]; const w = el.closest(".widget"); w.classList.remove("w1","w2","w4"); w.classList.add("w"+x.w); saveProfile({layout:lay},true); }
  else if(a==="w-hide" || a==="w-show"){ const lay = layoutOf(S.me); lay.find(o=>o.id===d.wid).hide = a==="w-hide"; saveProfile({layout:lay},true); rerender(); }
  else if(a==="share"){ const url = location.href.split("#")[0]+"#u-"+d.name; try{ await navigator.clipboard.writeText(url); toast(t("copied")); }catch(_){ toast(url); } }
  else if(a==="add-story") $("#story-file").click();
  else if(a==="view-active"){ const ids = activeStories(d.uid).map(s=>s.id); if(ids.length){ S.dialog={type:"viewer",uid:d.uid,ids,i:0}; renderDialog(); } }
  else if(a==="view-hl"){ const h = highlights(d.uid).find(x=>x[0]===d.name); if(h){ S.dialog={type:"viewer",uid:d.uid,ids:h[1].map(s=>s.id),i:0,hl:true}; renderDialog(); } }
  else if(a==="v-prev") stepViewer(-1);
  else if(a==="v-next") stepViewer(1);
  else if(a==="v-form"){ dlg.form=true; renderDialog(); }
  else if(a==="v-form-off"){ dlg.form=false; renderDialog(); }
  else if(a==="v-unhl"){ const s = curStory(); const { error } = await sb.from("stories").update({highlight:null}).eq("id",s.id); if(error) return toast(t("tFail")); s.highlight=null; toast(t("saved"));
    if(dlg.hl){ dlg.ids = dlg.ids.filter(id=>id!==s.id); } renderDialog(); if(!S.dialog) rerender(); }
  else if(a==="v-del"){ const s = curStory(); const { error } = await sb.from("stories").delete().eq("id",s.id); if(error) return toast(t("tFail"));
    sb.storage.from("media").remove([s.path]); S.stories[dlg.uid] = S.stories[dlg.uid].filter(x=>x.id!==s.id); dlg.ids = dlg.ids.filter(id=>id!==s.id); toast(t("deleted")); renderDialog(); if(!S.dialog) rerender(); }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if(el.id==="av-file" && el.files && el.files[0]){
    if(!S.me) return; const f = el.files[0]; el.value="";
    try{ const blob = await resizeImage(f,320,true), path = S.me.id+"/avatar-"+Date.now()+".jpg";
      const { error } = await sb.storage.from("media").upload(path,blob,{contentType:"image/jpeg"}); if(error) throw error; await setAvatar(path);
    }catch(_){ toast(t(f.type.startsWith("image/")?"tFail":"tNotImg")); }
    return;
  }
  if(el.id==="story-file" && el.files && el.files[0]){
    if(!S.me) return; const f = el.files[0]; el.value="";
    try{ const blob = await resizeImage(f,1280,false); S.dialog={type:"story-new",blob,url:URL.createObjectURL(blob)}; renderDialog(); }catch(_){ toast(t("tNotImg")); }
    return;
  }
  if(el.dataset && el.dataset.pf && S.me){
    const k = el.dataset.pf; let v = el.value.trim();
    if(k==="display_name" && !v){ el.value = S.me.display_name; return; }
    if(k==="age"){ v = (+v>=13 && +v<=99) ? +v : null; }
    saveProfile({[k]:v},true); $("#nav").innerHTML = navHTML();
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target.dataset.form;
  if(f==="signup") signup(); else if(f==="login") login(); else if(f==="edit") saveEdit();
  else if(f==="story"){ const d = S.dialog, btn = $("#st-go"), err = $("#st-err"); btn.disabled=true; err.textContent=t("working");
    try{ const path = S.me.id+"/stories/"+uid()+".jpg"; const up = await sb.storage.from("media").upload(path,d.blob,{contentType:"image/jpeg"}); if(up.error) throw up.error;
      const { data, error } = await sb.from("stories").insert({path,caption:val("st-cap")}).select().single(); if(error) throw error;
      (S.stories[S.me.id] = S.stories[S.me.id]||[]).push(data); URL.revokeObjectURL(d.url); S.dialog=null; renderDialog(); rerender(); toast(t("posted"));
    }catch(_){ btn.disabled=false; err.textContent=t("tFail"); } }
  else if(f==="hl"){ const s = curStory(), name = val("hl-name"); if(!name) return;
    const { error } = await sb.from("stories").update({highlight:name}).eq("id",s.id); if(error) return toast(t("tFail")); s.highlight=name; S.dialog.form=false; toast(t("saved")); renderDialog(); }
  else if(f==="add-roblox"){ const v = val("rbx-name"); if(!v) return;
    const all = GAMES.roblox.groups[0][1].map(x=>x[0]).concat(S.customRoblox), hit = all.find(x=>x.toLowerCase()===v.toLowerCase());
    if(!hit){ S.customRoblox.push(v); lsSet("gz.robloxCustom",JSON.stringify(S.customRoblox)); toast(t("tAdded",{n:v})); }
    S.pick.roblox.mode = hit || v; rerender(); }
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape"){ if(S.dialog){ S.dialog=null; renderDialog(); } else if(S.arranging){ setArranging(false); rerender(); } else if(S.menu){ S.menu=false; $("#nav").innerHTML = navHTML(); } }
  if(S.dialog && S.dialog.type==="viewer" && !S.dialog.form){ if(e.key==="ArrowRight") stepViewer(1); if(e.key==="ArrowLeft") stepViewer(-1); }
});
window.addEventListener("hashchange", () => { S.menu=false; S.dialog=null; renderDialog(); render(); window.scrollTo(0,0); });

/* ---------- boot ---------- */
render();
(async () => {
  if(!sb){ S.booting=false; render(); toast(t("eNet")); return; }
  try{ await loadMe(); }catch(e){}
  S.booting=false; render();
  sb.auth.onAuthStateChange(ev => { if(ev==="SIGNED_OUT" && S.me){ S.me=null; render(); } });
})();
</script>
