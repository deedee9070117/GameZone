<meta property="og:description" content="หาตี้ หาเพื่อนเล่นเกม จับคู่ตามแรงค์ ตำแหน่ง และนิสัย มีห้องแชทและห้องเสียงในตัว">

<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one quiet cream sheet, ink outlines, hard offset shadows; colour only on things you can press. */
  --paper:#F3EADB; --card:#FBF6EC; --ink:#3B2F2F; --ink-soft:#7A6A62; --line:#D9CCB8;
  --coral:#EF7A5E; --blue:#345E8F; --mustard:#E2B04A; --sage:#8DAA8B;
  --font-display:"Bowlby One","Arial Black",Impact,sans-serif;
  --font-body:"IBM Plex Sans","IBM Plex Sans Thai","Noto Sans SC","Noto Sans JP","Hiragino Sans","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sh:#3B2F2F; --field:#fff; --cream:#F3EADB; --nav-bg:#3B2F2F; --nav-fg:#F3EADB;
  --r:14px; --shadow:4px 4px 0 var(--sh);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:.03em;line-height:1.15;margin:0;text-wrap:balance}
html:not([lang="en"]) h1,html:not([lang="en"]) h2,html:not([lang="en"]) h3,html:not([lang="en"]) .btn.big,html:not([lang="en"]) .btn.mid{font-family:var(--font-body);font-weight:700;letter-spacing:0}
p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--font-mono),var(--font-body);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft);font-size:14px}

.nav{margin:16px auto 0;background:var(--nav-bg);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-family:var(--font-display);font-size:19px;color:var(--nav-fg);background:none;border:0;padding:6px 10px;letter-spacing:.04em;text-shadow:2px 2px 0 var(--coral)}
.nav-links{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.nav-links button{background:none;border:0;color:#D8CABB;padding:8px 12px;border-radius:9px;font-family:var(--font-mono),var(--font-body);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.nav-links button:hover{color:var(--paper)}
.nav-links button[aria-current="page"]{background:#55453F;color:var(--paper)}
.nav-right{display:flex;align-items:center;gap:8px;position:relative}
.me-btn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px;border-radius:999px;color:var(--nav-fg);font-size:14px}
.menu{position:absolute;right:0;top:calc(100% + 12px);background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);min-width:180px;padding:6px;z-index:20;display:flex;flex-direction:column}
.menu button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px}
.menu button:hover{background:var(--paper)}

.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;border:2px solid var(--ink);overflow:hidden;display:inline-grid;place-items:center;background:var(--blue);flex:none}
.nav .av{border-color:var(--nav-fg)}
.av img,.av svg{width:100%;height:100%;display:block;object-fit:cover}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:10px 18px;font-weight:600;box-shadow:3px 3px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sh)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}
.btn.coral{background:var(--coral)} .btn.blue{background:var(--blue);color:var(--cream)}
.btn.ghost{box-shadow:none;background:transparent} .btn.ghost:hover{background:var(--card);transform:none}
.btn.small{padding:6px 12px;font-size:14px;border-radius:10px;box-shadow:2px 2px 0 var(--sh)}
.btn.big{font-family:var(--font-display);font-weight:400;font-size:clamp(20px,3.4vw,28px);letter-spacing:.06em;padding:18px 40px;border-radius:20px;box-shadow:5px 5px 0 var(--sh);color:var(--cream);text-shadow:2px 2px 0 var(--sh)}
.btn.mid{font-family:var(--font-display);font-weight:400;font-size:clamp(14px,2.2vw,17px);letter-spacing:.06em;padding:12px 26px;color:var(--cream);text-shadow:1.5px 1.5px 0 var(--sh)}
.btn[disabled]{opacity:.5;pointer-events:none}

.hero{padding:72px 0 56px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.hero h1{font-size:clamp(34px,6.4vw,64px)}
.hero h1 em{font-style:normal;color:var(--coral);text-shadow:3px 3px 0 var(--sh)}
.hero p{max-width:46ch;color:var(--ink-soft);font-size:17px}
.hero-cta{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
section.block{padding:28px 0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:24px}
.grid{display:grid;gap:16px}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:18px}
.card.pop{box-shadow:var(--shadow)}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:0;overflow:hidden;box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sh)}
.band{height:92px;display:flex;align-items:flex-end;padding:12px 16px;border-bottom:2px solid var(--ink);position:relative;overflow:hidden}
.band h3{font-size:26px;color:var(--cream);text-shadow:2px 2px 0 var(--sh);position:relative;font-family:var(--font-display)!important;font-weight:400!important;letter-spacing:.03em!important}
.band::after{content:"";position:absolute;right:-18px;top:-18px;width:96px;height:96px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);opacity:.9}
.tile .body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:6px}
.c-coral{background:var(--coral)}.c-blue{background:var(--blue)}.c-mustard{background:var(--mustard)}.c-sage{background:var(--sage)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.chip:hover{background:var(--field)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tag{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:1px 9px;font-size:12.5px;background:var(--paper);white-space:nowrap}
.tag.full{background:var(--line);color:var(--ink-soft);border-color:var(--ink-soft)} .tag.open{background:var(--sage)} .tag.you{background:var(--mustard)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mode{text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.mode:hover{background:var(--field)}
.mode b{font-weight:600} .mode span{font-size:13.5px;color:var(--ink-soft)}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--paper)} .mode[aria-pressed="true"] span{color:#D8CABB}
.group-label{margin:18px 0 8px}
.queue{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:22px}
.room{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.room-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.room h3{font-family:var(--font-body);font-weight:600;font-size:17px;letter-spacing:0;line-height:1.3}
.slots{display:flex;gap:5px}
.slot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:transparent} .slot.on{background:var(--ink)} .slot.me{background:var(--mustard)}
.room-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:500}
.inp{border:2px solid var(--ink);border-radius:10px;background:var(--field);padding:9px 12px;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:70px}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.err{color:#B3261E;font-size:14px;min-height:20px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.hint{font-size:13px;color:var(--ink-soft);font-weight:400}

.scrim{position:fixed;inset:0;background:rgba(59,47,47,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.dialog{background:var(--paper);border:2px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--sh);width:min(460px,100%);padding:24px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.dialog.wide{width:min(580px,100%)}
.dialog h2{font-size:22px}
.dialog form{display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.tabs button{border:0;background:var(--card);padding:10px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.dialog-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.member{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1.5px dashed var(--line)}
.member:last-child{border-bottom:0}
.avatar-pick{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.avatar-pick button{background:none;border:0;padding:0;border-radius:50%}
.avatar-pick button[aria-pressed="true"] .av{box-shadow:0 0 0 3px var(--coral)}
.steps{display:flex;gap:8px;align-items:center}
.steps i{width:34px;height:8px;border-radius:99px;border:2px solid var(--ink);background:transparent} .steps i.on{background:var(--ink)}
.setup{max-width:640px;margin:36px auto;display:flex;flex-direction:column;gap:18px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--mustard);border:2px solid var(--ink);border-radius:var(--r);padding:12px 16px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
footer{padding:36px 0 72px;color:var(--ink-soft);font-size:13.5px;border-top:2px dashed var(--line);margin-top:28px}
.back{background:none;border:0;padding:0;color:var(--ink-soft);font-family:var(--font-mono),var(--font-body);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.back:hover{color:var(--ink)}
.game-hero{padding:32px 0 8px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.game-hero h1{font-size:clamp(34px,6vw,54px)}

/* language switch */
.lang{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;background:var(--card);border:2px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--sh);padding:3px;gap:2px}
.lang button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* profile */
.ph{display:flex;gap:32px;align-items:center;padding:36px 0 20px;flex-wrap:wrap}
.ring{background:none;border:0;padding:5px;border-radius:50%;flex:none}
.ring.has{background:conic-gradient(var(--coral),var(--mustard),var(--sage),var(--blue),var(--coral))}
.ring .av{border-width:3px;border-color:var(--paper);outline:2px solid var(--ink)}
.ph-info{flex:1;min-width:260px;display:flex;flex-direction:column;gap:10px}
.ph-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ph-top h1{font-family:var(--font-body);font-weight:700;font-size:26px;letter-spacing:0;overflow-wrap:anywhere;margin-right:6px}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stats b{font-size:18px}
.hls{display:flex;gap:18px;overflow-x:auto;padding:8px 2px 18px;border-bottom:2px dashed var(--line)}
.hl{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;flex:none;font-size:12.5px}
.hl span.c{width:66px;height:66px;border-radius:50%;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;overflow:hidden;font-size:26px;box-shadow:2px 2px 0 var(--sh)}
.hl span.c img{width:100%;height:100%;object-fit:cover}
.hl span.n{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrbar{display:none;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--mustard);border:2px solid var(--ink);border-radius:var(--r);padding:10px 14px;margin-top:16px}
.arranging .arrbar{display:flex}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 0;grid-auto-flow:dense}
.widget{grid-column:span 2;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
.widget.w1{grid-column:span 1}.widget.w4{grid-column:span 4}
.own .widget{-webkit-touch-callout:none}
.w-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.w-tools{display:flex;gap:6px}
.icon{border:2px solid var(--ink);background:var(--paper);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-size:13px;font-weight:700;padding:0;line-height:1}
.icon:hover{background:var(--field)}
.arr-only{display:none}
.arranging .arr-only{display:grid}
.arranging .edit-only{display:none}
.arranging .widget{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;animation:wig .28s ease-in-out infinite alternate}
.arranging .widget:nth-child(even){animation-delay:.14s}
@keyframes wig{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
.widget.dragging{opacity:.3;animation:none}
.drag-ghost{position:fixed;z-index:70;pointer-events:none;box-shadow:8px 8px 0 var(--sh);animation:none!important;transform:rotate(1.5deg);margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14.5px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.main-band{margin:0;height:68px;border:2px solid var(--ink);border-radius:10px}
.g-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:0;background:none;padding:8px 0;border-bottom:1.5px dashed var(--line);text-align:left;width:100%}
.g-row:last-child{border-bottom:0}
.hidden-list{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* story viewer */
.viewer{position:fixed;inset:0;background:#1d1717;z-index:60;display:flex;flex-direction:column;align-items:center;color:#F3EADB}
.v-top{width:min(460px,100%);padding:12px 14px 6px;display:flex;flex-direction:column;gap:10px}
.v-bars{display:flex;gap:4px} .v-bars i{flex:1;height:4px;border-radius:9px;background:#6b5a55} .v-bars i.on{background:#F3EADB}
.v-who{display:flex;align-items:center;gap:10px;font-size:14px}
.v-who .x{margin-left:auto;background:none;border:0;color:#F3EADB;font-size:24px;line-height:1;padding:4px 8px}
.v-stage{flex:1;width:min(460px,100%);position:relative;min-height:0;display:grid;place-items:center}
.v-stage img,.v-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.hl span.c video{width:100%;height:100%;object-fit:cover}
.v-stage button.z{position:absolute;top:0;bottom:0;width:38%;background:none;border:0}
.v-stage button.z.l{left:0}.v-stage button.z.r{right:0}
.v-cap{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(29,23,23,.7);padding:8px 12px;border-radius:10px;text-align:center}
.v-foot{width:min(460px,100%);padding:10px 14px 18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.v-foot .btn{box-shadow:none;border-color:#F3EADB;background:transparent;color:#F3EADB;font-size:14px;padding:7px 12px}
.v-foot .inp{width:auto;flex:1;min-width:140px;color:var(--ink)}
.preview{max-height:46vh;max-width:100%;border:2px solid var(--ink);border-radius:12px;align-self:center}

/* rooms */
.rm{padding:20px 0;display:flex;flex-direction:column;gap:16px}
.rm-head{display:flex;flex-direction:column;gap:10px}
.rm-head h1{font-family:var(--font-body);font-weight:700;font-size:24px;letter-spacing:0}
.rm-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rm-body{display:grid;grid-template-columns:230px minmax(0,1fr) 250px;gap:16px;align-items:start}
.rm-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.rm-chat{display:flex;flex-direction:column;height:min(64vh,620px);padding:0;overflow:hidden}
#rm-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;margin-top:12px}
.msg.cont{margin-top:2px}
.msg .b{white-space:pre-wrap;overflow-wrap:anywhere}
.msg time{font-size:12px;color:var(--ink-soft);margin-left:6px}
.chat-form{display:flex;gap:8px;padding:12px;border-top:2px solid var(--ink);background:var(--paper)}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:transparent;flex:none}
.dot.on{background:var(--sage)}
.person{display:flex;align-items:center;gap:8px;padding:6px 0;min-width:0}
.person .nm{min-width:0;flex:1;overflow:hidden}
.person .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);border:2px dashed var(--ink);border-radius:10px;padding:8px 12px}
.codebox b{font-family:var(--font-mono);font-size:18px;letter-spacing:.08em;overflow-wrap:anywhere}
.tag.c-mustard{background:var(--mustard)}
.tag.c-coral{background:var(--coral)}
.tag.c-blue{background:var(--blue);color:var(--cream)}
.rk{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--paper)}
.rk img{display:block}
.rk-to{color:var(--ink-soft);font-weight:700}
.cds{display:flex;gap:12px;flex-wrap:wrap}
.cd{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 8px;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cd b{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1;font-variant-numeric:tabular-nums}
.ev-num{font-family:var(--font-display);font-size:44px;letter-spacing:.14em;line-height:1}

function resizeImage(file,max,square){ return new Promise((res,rej)=>{ const fr = new FileReader(); fr.onerror = rej;
  fr.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
    const c = document.createElement("canvas"); let sx=0,sy=0,sw=img.width,sh=img.height;
    if(square){ const s=Math.min(sw,sh); sx=(sw-s)/2; sy=(sh-s)/2; sw=sh=s; c.width=c.height=Math.min(max,s); }
    else { const k=Math.min(1,max/Math.max(sw,sh)); c.width=Math.round(sw*k); c.height=Math.round(sh*k); }
    c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height); c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",.85); };
    img.src = fr.result; }; fr.readAsDataURL(file); }); }

const rankImg = (n,sz) => `<img src="ranks/${n.toLowerCase()}.png" alt="${n}" title="${n}" width="${sz}" height="${sz}" loading="lazy">`;
// ranked rooms show the rank range as badges; other modes keep the plain text tag
function rankTag(r,sz){ sz = sz||30;
  if(!isRanked(r) || (!r.rank_min && !r.rank_max)) return `<span class="tag">${esc(rankText(r))}</span>`;
  const a = VAL_RANKS.includes(r.rank_min)?r.rank_min:"Iron", b = VAL_RANKS.includes(r.rank_max)?r.rank_max:"Radiant";
  return `<span class="rk" aria-label="${esc(rankText(r))}">${rankImg(a,sz)}${a!==b?`<span class="rk-to">→</span>${rankImg(b,sz)}`:""}</span>`; }

async function loadVRooms(){
  if(!sb) return;
  const { data } = await sb.from("rooms").select(ROOM_SELECT).eq("game","valorant").gte("created_at",new Date(Date.now()-864e5).toISOString()).order("created_at",{ascending:false}).limit(60);

function whyNot(r){
  const m = membersOf(r); if(m.length>=r.size) return "roomFull";
  const p = S.me; if(!p || !isReady(p)) return "";
  if(p.age<r.age_min || p.age>r.age_max) return "whyAge";
  if(r.req_gender.length){ if(!p.gender) return "needGender"; if(!r.req_gender.includes(p.gender)) return "whyGender"; }
  if(r.req_vibes.length){ if(!p.vibes.length) return "needVibe"; if(!r.req_vibes.some(v=>p.vibes.includes(v))) return "whyVibe"; }
  if(r.rank_min || r.rank_max){ const mine = ((p.games||{}).valorant||{}).rank||"", i = VAL_RANKS.indexOf(mine);
    if(!mine) return "needRank";
    if(i<0 || (r.rank_min && i<VAL_RANKS.indexOf(r.rank_min)) || (r.rank_max && i>VAL_RANKS.indexOf(r.rank_max))) return "whyRank"; }

}

/* room page runtime: data, live channel, chat, voice */
let RC = {};
const ICE = {iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]};
function stopRoom(){ if(!RC.id) return; leaveVoice(true); clearInterval(RC.poll); clearInterval(RC.hb); if(RC.ch) try{ sb.removeChannel(RC.ch); }catch(e){} RC = {}; drawDock(); }
async function startRoom(id){

  render();
}
async function refreshRoom(first){
  const id = RC.id; if(!id) return;
  const { data, error } = await sb.from("rooms").select(ROOM_SELECT).eq("id",id).maybeSingle();
  if(RC.id!==id || error) { if(first && RC.id===id){ RC.state="gone"; } return; }
  if(!data){ const was = RC.member; stopRoom(); RC = {id,state:"gone"}; if(was) toast(t("roomGone")); if(!first) render(); loadVRooms(); return; }
  const was = RC.member; RC.data = data; RC.members = membersOf(data); RC.state = "ok";
  (data.room_members||[]).forEach(m=>{ if(m.profiles) RC.people[m.user_id] = m.profiles; });
  RC.gone = (data.room_members||[]).filter(m=>m.left_at).sort((a,b)=>new Date(b.left_at)-new Date(a.left_at));
  RC.member = !!S.me && RC.members.some(m=>m.user_id===S.me.id);
  if(was && !RC.member){ const here = location.hash==="#r-"+id; stopRoom(); toast(t("removed")); loadVRooms(); if(here) go("rooms"); return; }
  if(RC.member){ const { data:sec } = await sb.from("room_secrets").select("party_code").eq("room_id",id).maybeSingle(); if(RC.id===id) RC.code = sec ? sec.party_code : ""; }
  if(!first){ updateRoom("head"); updateRoom("members"); updateRoom("voice"); drawDock(); }
}
async function loadMsgs(){
  const id = RC.id; if(!id) return;
  const { data } = await sb.from("room_messages").select("id,body,created_at,user_id").eq("room_id",id).order("id",{ascending:false}).limit(150);
  if(RC.id!==id || !data) return;
  let added = false; data.forEach(m=>{ if(!RC.msgs.some(x=>x.id===m.id)){ RC.msgs.push(m); added = true; } });
  if(added || !RC.msgsLoaded){ RC.msgsLoaded = true; await afterMsgs(); }
}
async function afterMsgs(){
  RC.msgs.sort((a,b)=>a.id-b.id);
  const missing = [...new Set(RC.msgs.map(m=>m.user_id))].filter(u=>!RC.people[u]);
  if(missing.length){ const { data } = await sb.from("profiles").select("id,username,display_name,avatar").in("id",missing); (data||[]).forEach(p=>{ RC.people[p.id]=p; }); }
  updateRoom("msgs");
}
function addMsg(m){ if(!RC.id || m.room_id!==RC.id || RC.msgs.some(x=>x.id===m.id)) return; RC.msgs.push(m); afterMsgs(); }
async function openRoomLive(){
  const id = RC.id; await loadMsgs();
  try{ const { data:{ session } } = await sb.auth.getSession(); if(session) sb.realtime.setAuth(session.access_token); }catch(e){}
  const connect = priv => { let joined = false;
    // members-only channel first; falls back to an open one only if the private join is refused
    const ch = RC.ch = sb.channel("room-"+id,{config:{private:priv,presence:{key:S.me.id}}});
    ch.on("postgres_changes",{event:"INSERT",schema:"public",table:"room_messages",filter:"room_id=eq."+id},p=>addMsg(p.new))
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"room_members",filter:"room_id=eq."+id},()=>refreshRoom())
      .on("postgres_changes",{event:"DELETE",schema:"public",table:"room_members",filter:"room_id=eq."+id},()=>refreshRoom())
      .on("broadcast",{event:"sync"},()=>refreshRoom())
      .on("broadcast",{event:"vs"},({payload})=>{ if(!payload || !payload.from) return; RC.vmute[payload.from] = !!payload.muted; if(payload.left){ closePc(payload.from); delete RC.vmute[payload.from]; } else if(payload.hello && RC.inVoice) bsend("vs",{muted:!!RC.muted}); updateRoom("voice"); })
      .on("postgres_changes",{event:"*",schema:"public",table:"rooms",filter:"id=eq."+id},()=>refreshRoom())
      .on("presence",{event:"sync"},()=>{ if(RC.ch!==ch) return; const old = RC.presence||{}; RC.presence = ch.presenceState();
        Object.keys(old).forEach(u=>{ if(!RC.presence[u]){ RC.seenAt[u] = Date.now(); delete RC.spk[u]; } });
        updateRoom("members"); updateRoom("voice"); syncVoice(); drawDock(); })
      .on("broadcast",{event:"spk"},({payload})=>{ if(payload && payload.from) RC.spk[payload.from] = !!payload.on; })
      .on("broadcast",{event:"rtc"},({payload})=>onSignal(payload))
      .subscribe(st=>{ if(RC.ch!==ch) return;
        if(st==="SUBSCRIBED"){ joined = true; RC.priv = priv; trackMe(true); bsend("sync",{}); if(RC.inVoice) bsend("vs",{muted:!!RC.muted}); }
        else if(priv && !joined && (st==="CHANNEL_ERROR" || st==="TIMED_OUT")){ try{ sb.removeChannel(ch); }catch(e){} if(RC.id===id) connect(false); } });
  };
  RC.connect = connect; connect(true);
  RC.poll = setInterval(()=>{ refreshRoom(); loadMsgs();
    // if the live channel dropped (for example after a rate limit), rebuild it instead of staying silently disconnected
    const st = RC.ch && RC.ch.state; if(RC.connect && st!=="joined" && st!=="joining"){ try{ sb.removeChannel(RC.ch); }catch(e){} RC.connect(RC.priv!==false); }
  },8000);
  const beat = () => sb.from("room_members").update({last_seen:new Date().toISOString()}).eq("room_id",id).eq("user_id",S.me.id).then(()=>{});
  beat(); RC.hb = setInterval(beat,20000);
}
// presence updates are rate limited by the server, so they are sent at most once every few seconds; mute state travels by broadcast instead
let trackT = null, trackAt = 0;
function trackMe(now){
  const go = () => { trackT = null; trackAt = Date.now(); if(chOk()) RC.ch.track({voice:!!RC.inVoice}).catch(()=>{}); };
  clearTimeout(trackT); const wait = 3000-(Date.now()-trackAt);
  if(now || wait<=0) go(); else trackT = setTimeout(go,wait);
  return Promise.resolve();
}
const chOk = () => !!(RC.ch && RC.ch.state==="joined");
function bsend(event,payload){ if(chOk()) RC.ch.send({type:"broadcast",event,payload:{...payload,from:S.me.id}}); }
const isOnline = u => !!(RC.presence && RC.presence[u]);
// "here" = seen on the live channel, or checked in within the last minute (so one dropped connection doesn't show someone as gone)
function isHere(m){ return m.user_id===S.me.id || isOnline(m.user_id) || !!(RC.pcs && RC.pcs[m.user_id]) || (m.last_seen && Date.now()-new Date(m.last_seen) < 60000); }
const inVoiceNow = u => !!voiceOf(u) || !!(RC.pcs && RC.pcs[u] && RC.pcs[u].connectionState==="connected");
const voiceOf = u => { const p = RC.presence && RC.presence[u]; return p && p.find(x=>x.voice) || null; };

/* voice: direct peer-to-peer audio between room members, signalled over the room channel */
function sendSig(m){ bsend("rtc",m); }
function makePc(peer){
  const pc = new RTCPeerConnection(ICE); RC.pcs[peer] = pc; RC.pend[peer] = [];
  RC.stream.getTracks().forEach(tr=>pc.addTrack(tr,RC.stream));
  pc.onicecandidate = e => { if(e.candidate) sendSig({kind:"ice",to:peer,cand:e.candidate.toJSON()}); };
  pc.ontrack = e => { let a = document.getElementById("au-"+peer); if(!a){ a = document.createElement("audio"); a.id = "au-"+peer; a.autoplay = true; $("#audio-root").appendChild(a); }
    a.srcObject = e.streams[0]; a.muted = !!RC.deaf; a.play().catch(()=>{}); addMeter(peer,e.streams[0]); };
  pc.onconnectionstatechange = () => { if(RC.pcs[peer]!==pc) return; const st = pc.connectionState;
    if(st==="failed" || st==="closed"){ closePc(peer); setTimeout(syncVoice,1500); }
    else if(st==="disconnected") setTimeout(()=>{ if(RC.pcs[peer]===pc && pc.connectionState==="disconnected"){ closePc(peer); syncVoice(); } },8000);
    updateRoom("voice"); updateRoom("members"); };
  return pc;
}
function closePc(peer){ const pc = RC.pcs && RC.pcs[peer]; if(pc){ try{ pc.close(); }catch(e){} delete RC.pcs[peer]; } const a = document.getElementById("au-"+peer); if(a) a.remove(); if(RC.meters) delete RC.meters[peer]; }
async function syncVoice(){
  if(!RC.inVoice) return;
  const peers = Object.keys(RC.presence||{}).filter(u=>u!==S.me.id && voiceOf(u) && RC.members.some(m=>m.user_id===u));
  // keep a working call even if the other side briefly drops off the live channel; only clear calls that are not connected
  Object.keys(RC.pcs).forEach(u=>{ if(!peers.includes(u) && (RC.pcs[u].connectionState!=="connected" || !RC.members.some(m=>m.user_id===u))) closePc(u); });
  for(const u of peers){ if(RC.pcs[u] || S.me.id>u) continue; // the smaller id calls, so two people never call each other at once
    try{ const pc = makePc(u); const offer = await pc.createOffer(); await pc.setLocalDescription(offer); sendSig({kind:"offer",to:u,sdp:pc.localDescription}); }catch(e){ closePc(u); } }
}
async function onSignal(m){
  if(!RC.inVoice || !m || m.to!==S.me.id || !RC.members.some(x=>x.user_id===m.from)) return;
  try{
    if(m.kind==="offer"){ closePc(m.from); const pc = makePc(m.from); await pc.setRemoteDescription(m.sdp);
      for(const c of RC.pend[m.from]) await pc.addIceCandidate(c).catch(()=>{}); RC.pend[m.from] = [];
      const ans = await pc.createAnswer(); await pc.setLocalDescription(ans); sendSig({kind:"answer",to:m.from,sdp:pc.localDescription}); }
    else if(m.kind==="answer"){ const pc = RC.pcs[m.from]; if(pc){ await pc.setRemoteDescription(m.sdp); for(const c of RC.pend[m.from]||[]) await pc.addIceCandidate(c).catch(()=>{}); RC.pend[m.from] = []; } }
    else if(m.kind==="ice"){ const pc = RC.pcs[m.from]; if(pc && pc.remoteDescription) await pc.addIceCandidate(m.cand).catch(()=>{}); else (RC.pend[m.from] = RC.pend[m.from]||[]).push(m.cand); }
  }catch(e){}
}
async function joinVoice(){

  catch(e){ if(err) err.textContent = t("micErr"); return; }

  try{ RC.actx = new (window.AudioContext||window.webkitAudioContext)(); RC.meters = {}; addMeter(S.me.id,RC.stream); }catch(e){}
  await trackMe(true); bsend("vs",{muted:!!RC.muted,hello:true}); updateRoom("voice"); updateRoom("members"); syncVoice(); drawDock();
}
function leaveVoice(silent){
  if(!RC.inVoice) return; Object.keys(RC.pcs||{}).forEach(closePc);
  if(RC.stream) RC.stream.getTracks().forEach(tr=>tr.stop()); RC.stream = null; RC.inVoice = false; RC.muted = false; RC.deaf = false;
  if(RC.actx) try{ RC.actx.close(); }catch(e){} RC.actx = null; RC.meters = {}; if(RC.spkSent) bsend("spk",{on:false}); RC.spkSent = false; bsend("vs",{muted:false,left:true});
  if(!silent){ trackMe(true); updateRoom("voice"); drawDock(); }
}

function sinceText(ts){ const m = Math.floor((Date.now()-new Date(ts))/60000); return m<1 ? "" : m<60 ? t("minN",{n:m}) : t("hrN",{n:Math.floor(m/60)}); }
const leftText = ts => { const x = sinceText(ts); return x ? t("leftAgo",{x}) : t("leftNow"); };

/* ---------- who is speaking: green ring that follows voice level ---------- */
function addMeter(u,stream){
  if(!RC.actx || !RC.meters) return;
  try{ const src = RC.actx.createMediaStreamSource(stream), an = RC.actx.createAnalyser(); an.fftSize = 512; src.connect(an); RC.meters[u] = {an,buf:new Uint8Array(an.fftSize)}; }catch(e){}
}
function spkTick(){
  if(!RC.id || !RC.member || !S.me) return;
  const lv = {};
  if(RC.meters) for(const u in RC.meters){ const m = RC.meters[u]; m.an.getByteTimeDomainData(m.buf); let s = 0; for(let i=0;i<m.buf.length;i++){ const x = (m.buf[i]-128)/128; s += x*x; } lv[u] = Math.min(1,Math.sqrt(s/m.buf.length)*7); }
  if(RC.inVoice){
    const mine = RC.muted ? 0 : (lv[S.me.id]||0); lv[S.me.id] = mine;
    if(mine>0.1) RC.spkHold = Date.now();
    const flag = Date.now()-(RC.spkHold||0) < 450;
    if(flag!==!!RC.spkSent && Date.now()-(RC.spkAt||0)>400){ RC.spkSent = flag; RC.spkAt = Date.now(); bsend("spk",{on:flag}); }
  }
  document.querySelectorAll("[data-spk]").forEach(el=>{ const u = el.dataset.spk; let v = 0;
    if(inVoiceNow(u) || (u===S.me.id && RC.inVoice)){ if(lv[u]!=null) v = lv[u]>0.1 ? Math.max(.25,lv[u]) : 0; else if(RC.spk && RC.spk[u]) v = .5; }
    el.classList.toggle("on",v>0); el.style.setProperty("--lv",v.toFixed(2)); });
}
setInterval(spkTick,90);

/* ---------- social: friends, invites, blocks, reports, ratings ---------- */
const PFIELDS = "id,username,display_name,avatar";
const POS_TAGS = ["good","chill","comms","team","helpful"], NEG_TAGS = ["toxic","afk","troll","nocomms"];
const REPORT_REASONS = ["toxic","cheating","harassment","scam","inappropriate","underage","other"];
const SOC = {friends:[], incoming:[], outgoing:[], blocked:[], invites:[], loaded:false};
let socTimer;
async function loadSocial(){
  if(!S.me || !sb) return;
  const id = S.me.id;
  const [fr, bl, inv, nt] = await Promise.all([
    sb.from("friendships").select(`requester,addressee,status,created_at,r:profiles!friendships_requester_fkey(${PFIELDS}),a:profiles!friendships_addressee_fkey(${PFIELDS})`).or(`requester.eq.${id},addressee.eq.${id}`),
    sb.from("blocks").select(`blocked,p:profiles!blocks_blocked_fkey(${PFIELDS})`).eq("blocker",id),
    sb.from("invites").select(`id,room_id,created_at,from_id,f:profiles!invites_from_id_fkey(${PFIELDS}),rooms(title,mode)`).eq("to_id",id).order("created_at",{ascending:false}).limit(20),
    sb.from("notices").select("id,kind,body,created_at,read_at").order("id",{ascending:false}).limit(30)]);
  if(!S.me || S.me.id!==id) return;
  const rows = fr.data || [], other = f => f.requester===id ? f.a : f.r;
  SOC.friends = rows.filter(f=>f.status==="accepted").map(other).filter(Boolean);
  SOC.incoming = rows.filter(f=>f.status==="pending" && f.addressee===id).map(f=>f.r).filter(Boolean);
  SOC.outgoing = rows.filter(f=>f.status==="pending" && f.requester===id).map(f=>f.a).filter(Boolean);
  SOC.blocked = (bl.data||[]).map(b=>b.p).filter(Boolean);
  SOC.invites = (inv.data||[]).filter(x=>x.f && x.rooms && !SOC.blocked.some(b=>b.id===x.from_id));
  SOC.notices = nt.data || [];
  const keys = new Set([...SOC.incoming.map(p=>"f"+p.id),...SOC.invites.map(x=>"i"+x.id),...SOC.notices.filter(n=>!n.read_at).map(n=>"n"+n.id)]);
  if(socSeen){ const inv = SOC.invites.find(x=>!socSeen.has("i"+x.id)), fr = SOC.incoming.find(p=>!socSeen.has("f"+p.id));
    const nn = SOC.notices.find(n=>!n.read_at && !socSeen.has("n"+n.id));
    if(nn) toast("📣 "+nn.body.slice(0,70)); else if(inv) toast(inv.f.display_name+" "+t("invitedYou")+" "+inv.rooms.title); else if(fr) toast(fr.display_name+" "+t("wantsFriend")); }
  socSeen = keys; document.title = (keys.size?"("+keys.size+") ":"")+"GameZone";
  SOC.loaded = true;
  drawNav();
  if(S.dialog && ["notifs","friends"].includes(S.dialog.type)) renderDialog();
  if(["profile","user"].includes(route()) && !S.dialog && !drag) rerender();
}
let socCh = null, socSeen = null, socDeb = null;
function startSocial(){ clearInterval(socTimer); loadSocial();
  // fallback poll; it also rebuilds the live channel if that ever drops
  socTimer = setInterval(()=>{ if(document.hidden || !S.me) return; loadSocial(); const st = socCh && socCh.state; if(st!=="joined" && st!=="joining") socConnect(); },10000);
  socConnect();
}
async function socConnect(){
  if(!S.me) return; const id = S.me.id;
  // the live connection must carry the signed-in user's token, otherwise the server hides private rows (requests, invites) from it
  try{ const { data:{ session } } = await sb.auth.getSession(); if(session) sb.realtime.setAuth(session.access_token); }catch(e){}
  if(!S.me || S.me.id!==id) return;
  if(socCh) try{ sb.removeChannel(socCh); }catch(e){}
  const ping = () => { clearTimeout(socDeb); socDeb = setTimeout(loadSocial,300); };
  socCh = sb.channel("user-"+id)
    .on("postgres_changes",{event:"*",schema:"public",table:"friendships",filter:"addressee=eq."+id},ping)
    .on("postgres_changes",{event:"*",schema:"public",table:"friendships",filter:"requester=eq."+id},ping)
    .on("postgres_changes",{event:"*",schema:"public",table:"invites",filter:"to_id=eq."+id},ping)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"notices",filter:"user_id=eq."+id},ping)
    .subscribe();
}
function stopSocial(){ clearInterval(socTimer); if(socCh){ try{ sb.removeChannel(socCh); }catch(e){} socCh = null; } socSeen = null; Object.assign(SOC,{friends:[],incoming:[],outgoing:[],blocked:[],invites:[],notices:[],loaded:false}); }
const isBlockedId = id => SOC.blocked.some(b=>b.id===id);
function relation(id){
  if(SOC.friends.some(p=>p.id===id)) return "friends";
  if(SOC.incoming.some(p=>p.id===id)) return "incoming";
  if(SOC.outgoing.some(p=>p.id===id)) return "outgoing";
  return "none";
}
const notifCount = () => SOC.incoming.length + SOC.invites.length + (SOC.notices||[]).filter(n=>!n.read_at).length;
function myRoomId(){

  const res = await Promise.all(list.map(([u,v])=>sb.rpc("rate_player",{p_target:u,p_room:d.room,p_thumb:v.thumb,p_tags:v.tags||[]})));
  if(res.some(r=>r.error)){ btn.disabled = false; return $("#rt-err").textContent = t("tFail"); }
  S.dialog=null; renderDialog(); toast(t("rateSaved"));
}

/* actions */
async function socialClick(a,d,el){
  const rerenderAll = () => { loadSocial(); if(S.viewing && S.viewing.id===d.uid){ S.viewKey=""; } };
  if(a==="notifs"){ S.menu=false; S.dialog={type:"notifs"}; renderDialog(); loadSocial(); }
  else if(a==="friend-add") gate("actFriend",async()=>{ const { data, error } = await sb.rpc("friend_request",{p_target:d.uid});
      if(error) return toast(error.message.includes("blocked")?t("whyBlocked"):t("tFail")); toast(data==="accepted"||data==="friends"?t("tNowFriends"):t("tReqSent")); await loadSocial(); if(S.dialog&&S.dialog.type==="rate") renderDialog(); });
  else if(a==="friend-accept"){ const { error } = await sb.rpc("friend_accept",{p_from:d.uid}); if(error) return toast(t("tFail")); toast(t("tNowFriends")); rerenderAll(); }
  else if(a==="friend-decline" || a==="friend-cancel"){ await sb.from("friendships").delete().or(`and(requester.eq.${d.uid},addressee.eq.${S.me.id}),and(requester.eq.${S.me.id},addressee.eq.${d.uid})`); loadSocial(); }
  else if(a==="unfriend"){ S.dialog={type:"confirm",title:t("unfriend"),text:t("unfriendConfirm",{n:esc(d.name)}),act:"unfriend-yes",uid:d.uid,ok:t("unfriend")}; renderDialog(); }
  else if(a==="unfriend-yes"){ await sb.from("friendships").delete().or(`and(requester.eq.${d.uid},addressee.eq.${S.me.id}),and(requester.eq.${S.me.id},addressee.eq.${d.uid})`); S.dialog=null; renderDialog(); rerenderAll(); }
  else if(a==="invite"){ const { error } = await sb.rpc("invite_friend",{p_to:d.uid,p_room:d.room}); toast(error?t("tFail"):t("invited")); }
  else if(a==="invite-join"){ const { error } = await sb.rpc("join_room",{p_room:d.room,p_role:""});
      if(error){ toast(t(joinErrKey(error.message)));
        await sb.from("invites").delete().eq("id",d.iid); return loadSocial(); }
      S.dialog=null; renderDialog(); loadSocial(); loadVRooms(); if(RC.id===d.room) RC = {}; go("r-"+d.room); }
  else if(a==="invite-dismiss"){ await sb.from("invites").delete().eq("id",d.iid); loadSocial(); }
  else if(a==="friends"){ S.dialog={type:"friends",uid:d.uid,name:d.name}; renderDialog(); if(!(S.me&&d.uid===S.me.id)) loadFriendsOf(d.uid); }
  else if(a==="more") gate("actFriend",()=>{ S.dialog={type:"more",uid:d.uid,name:d.name}; renderDialog(); });
  else if(a==="report") gate("actFriend",()=>{ S.dialog={type:"report",uid:d.uid,name:d.name,room:d.room||null,back:S.dialog&&S.dialog.type==="rate"?S.dialog:null}; renderDialog(); });
  else if(a==="block-ask"){ S.dialog={type:"confirm",title:t("block"),text:t("blockConfirm",{n:esc(d.name)}),act:"block-yes",uid:d.uid,ok:t("block")}; renderDialog(); }
  else if(a==="block-yes"){ const { error } = await sb.rpc("block_user",{p_target:d.uid}); if(error) return toast(t("tFail")); S.dialog=null; renderDialog(); toast(t("tBlocked")); await loadSocial(); updateRoom("msgs"); }
  else if(a==="unblock"){ await sb.from("blocks").delete().eq("blocker",S.me.id).eq("blocked",d.uid); toast(t("tUnblocked")); await loadSocial(); updateRoom("msgs"); }
  else if(a==="rate-open") openRate(d.room);
  else if(a==="rate-thumb"){ const pk = S.dialog.picks[d.uid] = S.dialog.picks[d.uid]||{tags:[]}; const v = +d.val; if(pk.thumb!==v){ pk.thumb = v; pk.tags = []; } else { pk.thumb = 0; pk.tags = []; } renderDialog(); }
  else if(a==="rate-tag"){ const pk = S.dialog.picks[d.uid]; const i = pk.tags.indexOf(d.val); if(i>=0) pk.tags.splice(i,1); else if(pk.tags.length<5) pk.tags.push(d.val); renderDialog(); }
  else if(a==="rate-save") saveRatings();
  else if(a==="report-resolve"){ await sb.rpc("admin_resolve_report",{p_id:+d.id}); S.admin = null; render(); }
  else return false;
  return true;
}
async function submitReport(){
  const d = S.dialog, btn = $("#rp-go"); btn.disabled = true;
  const { error } = await sb.from("reports").insert({target:d.uid,reason:val("rp-reason"),detail:val("rp-detail"),room_id:d.room||null});
  if(error){ btn.disabled = false; return $("#rp-err").textContent = t("tFail"); }
  toast(t("tReported")); S.dialog = d.back || null; renderDialog();
}

en:["Privacy Policy",[
["Who we are","GameZone (joingamezone.com) is a website for finding people to play games with. It is in beta and run by the GameZone developers in Thailand."],
["What we collect","<ul><li><b>Account:</b> your username and a one-way hashed password. Neither we nor admins can see your password.</li><li><b>Profile details you enter:</b> display name, picture, age, gender, MBTI, bio, play style, games, in-game name, rank, roles, PC specs, gear, settings, and contacts (Discord, LINE, Instagram).</li><li><b>Content you post:</b> story images and clips, and room chat messages.</li><li><b>Activity:</b> rooms you create or join, your last 10 rooms, friends, blocks, ratings you give teammates, reports you send, and event entries.</li><li><b>Visitor statistics:</b> a random ID stored in your browser and where the visit came from (for example Facebook), counted once a day.</li></ul>"],
["What we don't collect","We don't ask for your email, phone number, real name or game account password. There are no payments, and voice chat is not recorded. We don't store your IP address in our database, though our infrastructure providers (below) may log IP addresses in their own server logs as part of normal web hosting."],
["Who can see what","<ul><li><b>Everyone:</b> name, picture, bio, game details, gear, stories, friends list, and the likes and tags you have received.</li><li><b>You can hide:</b> age, gender and play history, in Settings. Hidden age and gender are still used to check room rules and matchmaking.</li><li><b>Contacts:</b> friends only by default. You can change this to everyone or hidden.</li><li><b>Room chat and party code:</b> members of that room only.</li><li><b>Ratings you give and your blocks:</b> only you.</li><li><b>Admins:</b> can access profiles, reports and event entries to keep the site safe.</li></ul>"],
["Voice chat","Voice is sent directly between players' devices (peer-to-peer). It does not pass through and is not recorded on our servers. A limit of this method is that technically skilled players in the same voice room may be able to see your IP address. If you are not comfortable with that, use text chat only."],
["How we use data","To show profiles, match players and check room rules, keep players under 18 apart from adults, handle safety reports, and understand overall usage. We do not sell your data or use it for targeted advertising."],
["Providers we use","<ul><li><b>Supabase:</b> database, accounts and file storage (servers in Singapore)</li><li><b>GitHub Pages:</b> serves the website</li><li><b>Cloudflare:</b> domain name service</li><li><b>Google Fonts, jsDelivr:</b> fonts and libraries</li><li><b>Google STUN:</b> helps connect voice chat</li></ul>"],
["Retention and deletion","Stories not saved to a highlight are deleted after 24 hours. Play history keeps your last 10 rooms. Other data is kept until you remove it or delete your account. You can delete your account at any time in Settings → Delete account, which permanently removes your profile, images, clips, chat messages and related data."],
["Your rights","You can view and edit your data on your profile, hide parts of it, delete your account, and contact us with questions or to exercise your rights under data protection law (Thailand's PDPA)."],
["Minors","You must be 13 or older. Minors should have a parent's or guardian's consent. Players under 18 are kept apart from adults in rooms and matchmaking, based on self-reported age, which we cannot verify."],
["Browser storage","The site uses your browser's local storage to remember your login, language, theme and the random visitor ID. There are no advertising cookies."],
["Changes and contact","If this policy changes we will update the date above and announce it on the site. {contact}"]]]},

async function callManage(body){
  try{ const { data:{ session } } = await sb.auth.getSession(); if(!session) return {error:"auth"};
    const res = await fetch(SB_URL+"/functions/v1/manage",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+session.access_token},body:JSON.stringify(body)});
    return await res.json().catch(()=>({error:"failed"}));
  }catch(e){ return {error:"network"}; }
}

async function submitDelAccount(){
  const err = $("#da-err"), btn = $("#da-go");
  if(val("da-name").toLowerCase()!==S.me.username.toLowerCase()) return err.textContent = t("delAccWrong");
  btn.disabled = true; err.textContent = t("working");
  stopRoom(); stopMatch(true);
  const out = await callManage({action:"delete_self"});
  if(!out.ok){ btn.disabled = false; return err.textContent = t("tFail"); }
  stopSocial(); S.isAdmin = false; try{ await sb.auth.signOut(); }catch(e){} S.me = null; S.dialog = null; renderDialog(); go("home"); toast(t("delAccDone"));
}

async function legalClick(a,d,el){
  if(a==="del-account"){ S.dialog = {type:"del-account"}; renderDialog(); }
  else if(a==="admin-ban"){ S.dialog = {type:"confirm",title:t("ban"),text:t("banConfirm",{n:esc(d.name)}),act:"admin-ban-yes",uid:d.uid,ok:t("ban")}; renderDialog(); }
  else if(a==="admin-ban-yes" || a==="admin-unban" || a==="admin-clear"){
    const out = await callManage({action:a==="admin-ban-yes"?"ban":a==="admin-unban"?"unban":"clear_profile",target:d.uid});
    toast(out.ok?t("saved"):out.error==="is_admin"?t("banAdmin"):t("tFail")); S.dialog = null; renderDialog(); S.admin = null; S.viewKey = ""; render(); }
  else if(a==="v-admin-del"){ const s = curStory(), dl = S.dialog; const out = await callManage({action:"delete_story",story_id:s.id}); if(!out.ok) return toast(t("tFail"));
    S.stories[dl.uid] = S.stories[dl.uid].filter(x=>x.id!==s.id); dl.ids = dl.ids.filter(id=>id!==s.id); toast(t("deleted")); renderDialog(); if(!S.dialog) rerender(); }
  else if(a==="v-join-yes"){ lsSet("gz.voiceok","1"); S.dialog = null; renderDialog(); joinVoice(); }
  else return false;
  return true;
}

const Q = {st:"idle",form:{game:"valorant",mode:"any",style:"any",adult:null},msgs:[],last:0,info:null,timer:null,ch:null,waiting:0,busy:false,reporting:false,since:0,guest:null};
try{ Object.assign(Q.form, JSON.parse(lsGet("gz.qform")||"{}")); if(!GAMES[Q.form.game]) Q.form.game = "valorant"; }catch(e){}
const qRanked = () => /Ranked/.test(Q.form.mode), qRankName = (g,i) => (i===null || i===undefined || !GAMES[g]) ? "" : (GAMES[g].ranks[i]||"");

function qGuest(){ if(Q.guest) return Q.guest; try{ Q.guest = JSON.parse(lsGet("gz.guest")||"null"); }catch(e){} return Q.guest; }
async function qRpc(fn,args,retry){
  let cred = {p_gid:null,p_secret:null};
  if(!S.me){
    if(!qGuest()){ const { data, error } = await sb.rpc("guest_new"); if(error || !data) return {error:error||{message:"net"}}; Q.guest = data; lsSet("gz.guest",JSON.stringify(data)); }
    cred = {p_gid:Q.guest.id,p_secret:Q.guest.secret};
  }
  const res = await sb.rpc(fn,{...cred,...args});
  // a guest id the server no longer knows is replaced once with a fresh one
  if(res.error && /bad_guest/.test(res.error.message||"") && !S.me && !retry){ Q.guest = null; try{ localStorage.removeItem("gz.guest"); }catch(e){} return qRpc(fn,args,true); }
  return res;
}
function qChan(pair){
  if(Q.ch){ try{ sb.removeChannel(Q.ch); }catch(e){} Q.ch = null; }
  if(pair) Q.ch = sb.channel("quick-"+pair).on("broadcast",{event:"m"},()=>qTick()).subscribe();
}
// the live channel only says "something changed"; the content always comes from the server check, so chat still works if the channel fails
const qPing = () => { if(Q.ch && Q.ch.state==="joined") Q.ch.send({type:"broadcast",event:"m",payload:{}}); };
function qStop(){ clearInterval(Q.timer); Q.timer = null; qChan(null); }
function qApply(d){
  if(!d) return; const prev = Q.st, prevPair = Q.info && Q.info.pair;
  if(d.state==="none"){ qStop(); Q.st = "idle"; Q.info = null; }
  else if(d.state==="searching"){ Q.st = "searching"; Q.waiting = d.waiting||0; }
  else { Q.st = d.state; Q.info = d; (d.msgs||[]).forEach(m=>{ if(m.id>Q.last){ Q.msgs.push(m); Q.last = m.id; } });
    if(d.state==="ended") qStop(); else if(d.pair!==prevPair || !Q.ch) qChan(d.pair); }
  if(prev==="searching" && Q.st==="chat") toast(t("qFound"));
  qDraw(prev!==Q.st);
}
async function qTick(){
  if(Q.ticking || !["searching","chat"].includes(Q.st)) return; Q.ticking = true;
  const { data, error } = await qRpc("quick_tick",{p_after:Q.last}); Q.ticking = false;
  if(!error && ["searching","chat"].includes(Q.st)) qApply(data);
}
async function qStart(){
  if(!sb) return toast(t("eNet")); if(Q.busy) return; const f = Q.form;
  if(qRanked() && (f.rank===null || f.rank===undefined || !GAMES[f.game].ranks[f.rank])) return toast(t("qPickRank"));
  if(qNeedsAge() && f.adult!==true && f.adult!==false) return toast(t("qPickAge"));
  Q.busy = true; lsSet("gz.qform",JSON.stringify(f));
  const { data, error } = await qRpc("quick_start",{p_game:f.game,p_mode:f.mode,p_style:f.style,p_adult:qNeedsAge()?f.adult:null,p_rank:qRanked()?f.rank:null});
  Q.busy = false;
  if(error) return toast(/banned/.test(error.message||"")?t("youBanned"):t("tFail"));
  qPing(); qStop(); Q.msgs = []; Q.last = 0; Q.info = null; Q.reporting = false; Q.since = Date.now(); Q.st = "idle";
  qApply(data); if(Q.st!=="idle") Q.timer = setInterval(qTick,2000);
}
async function qLeave(){
  const was = Q.st; if(was==="idle") return;
  clearInterval(Q.timer); Q.timer = null; Q.st = "idle"; Q.reporting = false;
  if(was!=="ended"){ await qRpc("quick_leave",{}); qPing(); }
  qChan(null); Q.info = null; Q.msgs = []; Q.last = 0; qDraw(true);
}
async function qSend(){

}

const synthEmail = name => name.toLowerCase()+"@users.gamezone.app";
async function signup(){
  const name = $("#au-user").value.trim(), pw = $("#au-pass").value, pw2 = $("#au-pass2").value, err = $("#au-err"), btn = $("#au-go");
  if(!/^[A-Za-z0-9_]{3,16}$/.test(name)) return err.textContent = t("eUser");
  if(pw.length<8) return err.textContent = t("ePass");
  if(pw!==pw2) return err.textContent = t("eMatch");
  lsSet("gz.remember",$("#au-remember").checked?"1":"0");
  btn.disabled = true; err.textContent = t("working");
  try{
    const res = await fetch(SB_URL+"/functions/v1/signup",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({username:name,password:pw})});
    const out = await res.json().catch(()=>({}));
    if(!res.ok){ btn.disabled=false; return err.textContent = out.error==="taken"?t("eTaken"):out.error==="bad_username"?t("eUser"):out.error==="bad_password"?t("ePass"):t("eNet"); }
    const { error } = await sb.auth.signInWithPassword({email:synthEmail(name),password:pw});
    if(error) throw error;
    await loadMe(); S.dialog=null; S.setupStep=1; renderDialog(); go("setup");
  }catch(e){ btn.disabled=false; err.textContent = t("eNet"); }
}
async function login(){
  const name = $("#au-user").value.trim(), pw = $("#au-pass").value, err = $("#au-err"), btn = $("#au-go");
  if(!/^[A-Za-z0-9_]{3,16}$/.test(name) || !pw) return err.textContent = t("eWrong");
  lsSet("gz.remember",$("#au-remember").checked?"1":"0");
  btn.disabled = true; err.textContent = t("working");
  try{
    const { error } = await sb.auth.signInWithPassword({email:synthEmail(name),password:pw});
    if(error){ btn.disabled=false; return err.textContent = error.status===400 ? t("eWrong") : t("eNet"); }

/* ---------- drag to arrange (press and hold, like phone widgets) ---------- */
let drag = null, press = null, pressTimer = null;
function setArranging(on){ S.arranging = on; const r = $("#pf-root"); if(r) r.classList.toggle("arranging",on); }
function startDrag(w,x,y){
  const rect = w.getBoundingClientRect(), ghost = w.cloneNode(true);
  ghost.classList.add("drag-ghost"); ghost.style.width = rect.width+"px"; ghost.style.height = rect.height+"px"; ghost.style.left = rect.left+"px"; ghost.style.top = rect.top+"px";
  document.body.appendChild(ghost); w.classList.add("dragging"); drag = {w,ghost,dx:x-rect.left,dy:y-rect.top};
}
function saveLayoutFromDOM(){
  const grid = $("#wgrid"); if(!grid || !S.me) return; const lay = layoutOf(S.me), order = [...grid.children].map(c=>c.dataset.wid);
  const next = order.map(id=>lay.find(x=>x.id===id)).filter(Boolean).concat(lay.filter(x=>!order.includes(x.id)));
  saveProfile({layout:next},true);
}
document.addEventListener("pointerdown", e => {
  const w = e.target.closest(".own .widget"); if(!w || S.dialog) return;
  if(e.target.closest("button,a,input,select,textarea")) return;
  if(e.pointerType==="mouse" && e.button!==0) return;
  press = {w,x:e.clientX,y:e.clientY,armed:S.arranging};
  if(!S.arranging) pressTimer = setTimeout(()=>{ if(!press) return; setArranging(true); startDrag(press.w,press.x,press.y); press=null; if(navigator.vibrate) try{ navigator.vibrate(12); }catch(_){} },450);
});
document.addEventListener("pointermove", e => {
  if(drag){
    drag.ghost.style.left = (e.clientX-drag.dx)+"px"; drag.ghost.style.top = (e.clientY-drag.dy)+"px";
    const hit = document.elementFromPoint(e.clientX,e.clientY), target = hit && hit.closest(".widget");
    if(target && target!==drag.w && target.parentElement===drag.w.parentElement){
      const after = drag.w.compareDocumentPosition(target) & Node.DOCUMENT_POSITION_FOLLOWING;
      target.parentElement.insertBefore(drag.w, after ? target.nextSibling : target);
    }
  } else if(press){
    const dist = Math.hypot(e.clientX-press.x,e.clientY-press.y);
    if(press.armed && dist>5){ startDrag(press.w,e.clientX,e.clientY); press=null; }
    else if(!press.armed && dist>8){ clearTimeout(pressTimer); press=null; }
  }
});
function endPress(){ clearTimeout(pressTimer); press=null; if(drag){ drag.ghost.remove(); drag.w.classList.remove("dragging"); drag=null; saveLayoutFromDOM(); } }
document.addEventListener("pointerup", endPress);
document.addEventListener("pointercancel", endPress);
document.addEventListener("touchmove", e => { if(drag) e.preventDefault(); }, {passive:false});
document.addEventListener("contextmenu", e => { if(e.target.closest(".own .widget") && (drag || S.arranging || press)) e.preventDefault(); });

  else if(f==="chat") sendChat();
  else if(f==="add-roblox"){ const v = val("rbx-name"); if(!v) return;
    const all = GAMES.roblox.groups[0][1].map(x=>x[0]).concat(S.customRoblox), hit = all.find(x=>x.toLowerCase()===v.toLowerCase());
    if(!hit){ S.customRoblox.push(v); lsSet("gz.robloxCustom",JSON.stringify(S.customRoblox)); toast(t("tAdded",{n:v})); }
    S.pick.roblox.mode = hit || v; rerender(); }
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape"){ if(S.dialog){ S.dialog=null; renderDialog(); } else if(S.arranging){ setArranging(false); rerender(); } else if(S.menu){ S.menu=false; drawNav(); } }
  if(S.dialog && S.dialog.type==="viewer" && !S.dialog.form){ if(e.key==="ArrowRight") stepViewer(1); if(e.key==="ArrowLeft") stepViewer(-1); }
});
setInterval(()=>{ if(!document.hidden && !S.dialog && sb && (["home","valorant","rooms"].includes(route()) || (S.me && !RC.id))) loadVRooms(); },12000);
window.addEventListener("hashchange", () => { if(route()!=="quick" && Q.st!=="idle") qLeave(); S.menu=false; S.dialog=null; renderDialog(); render(); window.scrollTo(0,0); if(["home","valorant","rooms"].includes(route())) loadVRooms(); if(route()==="event") loadEvent(); });

/* ---------- boot ---------- */
applyTheme();
render();
(async () => {
  if(!sb){ S.booting=false; render(); toast(t("eNet")); return; }
  logVisit();
  try{ await loadMe(); }catch(e){}
  S.booting=false; render(); loadVRooms(); if(route()==="event") loadEvent();
  sb.auth.onAuthStateChange((ev,session) => { if(ev==="SIGNED_OUT" && S.me){ S.me=null; render(); } else if(session && (ev==="TOKEN_REFRESHED" || ev==="SIGNED_IN")){ try{ sb.realtime.setAuth(session.access_token); }catch(e){} } });
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.me) loadSocial(); });
})();
</script>
